 ##### ЕВЕНТЫ ######
 
 crimea.1.t: "Самый масштабный про-шахматный митинг за всё время!"
 crimea.1.d: "Произошел самый масшатбный митинг за всю историю Крыма! Организатором этого митинга является Анатолий Шевченко - самый главный оппозиционер за последние несколько месяцев. Сам митинг проходил в Щёлкино - место проживания Анатолия. На улицы вышло более 150 тыс. крымчан!"
 crimea.1.a: "Урааааа, Анатолий!"
 crimea.1.b: "Разогнать их!"
 crimea.2.t: "Гражданская война охватила Крым"
 crimea.2.t: "Гражданская война охватила Крым"
 crimea.2.d: "Люди устали терпеть эти глупые издевательства над шахматистами, пора положить этому конец! В Крыму началась гражданская война, которая затронет каждого. Во главе восстания стоит Анатолий Шевченко (ранее организовывавший митинги против анти-шахматной политики)."
 crimea.2.a: "Мы должны избавить Крым от шашкистов!"
 crimea.3.t: "Мы победили!"
 crimea.3.d: "Спустя столько лет угнетения шахматистов восторжествовала справедливость! Благодаря Анатолию и другим крымчанам, которые устали это терпеть, можно не боясь играть и говорить о шахматах. У Крыма будет светлое будущие!"
 crimea.3.a: "Ура! Ура! Ура!"
 crimea.4.t: "Николай похудел!"
 crimea.4.d: "Наконец-то Коля смог похудеть, это было очень не просто! Защита у него стало хуже, но если продолжать в том же духе, то он накачается и будут бонусы к атаке!"
 crimea.4.a: "Долой 8жир!!"
 crimea.5.t: "Коля сорвался!"
 crimea.5.d: "Во время тренировок Коля увидел биг-тейсти. Он не смог сдержаться и съел его, а после пошел в макдональдс и все тренировки пошли коту под хвост..."
 crimea.5.a: "Будь он проклят!"
 crimea.6.t: "Коля разбух!"
 crimea.6.d: "Во время тренировок Коля увидел биг-тейсти. Он не смог сдержаться и съел его, а после пошел в макдональдс и все тренировки пошли коту под хвост..."
 crimea.6.a: "Ура, 8жир!!"
 crimea.13.t: "Советский Союз усиливает своё влияние на нас!"
 crimea.13.d: "Советский Союз направляет своих представителей в крымскую администрацию и школы. Местные власти должны прислушиваться к советским наставлениям, а население чувствует, что Москва всё сильнее влияет на дела региона."
 crimea.13.a: "Вот гады!"
 crimea.14.t: "Митинги промосковских активистов!"
 crimea.14.d: "На улицах городов начали собираться массовые митинги под прошашковыми и социалистическими лозунгами. Ведущие активисты проводят агитацию за 'шашковое единство' и поднимают вопросы о скорой интеграции с СССР."
 crimea.14.a: "Грёбаные сепаратисты"
 crimea.15.t: "Советский ультиматум Крыму"
 crimea.15.d: "Советское правительство выражает глубокую обеспокоенность происходящими событиями в Крыму. После контрреволюционного переворота, проведённого про-шахматный элементами, положение в регионе стало представлять угрозу стабильности всего социалистического пространства. В связи с этим, Совет Народных Комиссаров требует немедленного восстановления дружественного режима в Крыму."
 crimea.15.a: "Нам больше ничего не остаётся, кроме как согласиться..."
 crimea.15.b: "Мы согласны стать субъектом"
 crimea.15.c: "Мы будем сражаться!"
 crimea.16.t: "Аннексия Севастополя!"
 crimea.16.d: "Сегодня, в 12:00 по Щёлкино, на дворце были опущены крымские флаги и были подняты британские. Люди в полном недоумении, никто не знает как на это реагировать. Крым сейчас в огне, мы никак не сможем в одиночку тягаться с самой сильной империей в этом мире. Когда Анатолий услышал эту новость, он грустно опустил глаза на пол, сел за своё кресло и начал печатать новые приказы для своей армии."
 crimea.16.a: "Они за это заплатят!"
 crimea.17.t: "Анатолий в Симферополе"
 crimea.17.d: "Анатолий приехал в Симферополь - вторую столицу Крыма, и устроил митинг против шашкистов, это был первый митинг за последние 10 лет. Шашковый совет никак не среагировал..."
 crimea.17.a: "Анатолий я твой фанат"
 crimea.18.t: "Кровавый понедельник"
 crimea.18.d: "Произошла первая стычка между шашкистами и шахматистами в Щёлкино. Отряд из 9 шашкистов напал на одиноко сидящего за столом шахматиста. Один из шашкистов был с ножом и перерезал горло шахматисту. На место проишествия подбежало 15 шахматистов и началась бойня. Всех шашкистов забили досмерти и погибло 12 шахматистов."
 crimea.18.a: "Ну и ужас"
 crimea.19.t: "Локдаун Севастополя"
 crimea.19.d: "Всвязи с протестами шахматистов в Севастополе, шашкисты приняли решение полностью изолировать город от Крыма, чтоб туда не приехал Анатолий и ещё больше шахматистов."
 crimea.19.a: "Не до чего хорошего это не доведёт..."
 crimea.20.t: "Начался отлов шахматистов"
 crimea.20.d: "С этого дня, на любого, кто участвовал в митингах и поддерживал Анатолия, могли завести уголовное дело и отправить на каторгу. Тем не менее Анатолий призывает людей не бояться, ведь рано или поздно всё это закончится."
 crimea.20.a: "Хорошо, Анатолий, мы верим тебе!"
 crimea.21.t: "Восточный Крым в огне!"
 crimea.21.d: "В Восточном Крыму (в частности в Щёлкино) проживает больше всего шахматистов, поэтому там начались массовые бунты против шашкистов. Шахматисты рушат всё, что хоть как то связано с шашкизмом."
 crimea.21.a: "Свободу шахматистам!"
 crimea.22.t: "Щёлкино - истинная столица Крыма"
 crimea.22.d: "Сегодня Анатолий выступил с речью, что столица Крыма должна находиться в Щёлкино. Шахматисты поддержали его высказывание, ведь Севастополь был изолирован от Крыма."
 crimea.22.a: "Щёлкино - рай на земле"
 crimea.23.t: "Последнее выступление Анатолия"
 crimea.23.d: "Сегодня утром Анатолий стоял в своем кабинете возле окна покуривая папиросы. После того, как к нему зашла его охрана, он с небольшой улыбкою повернулся к ней и сказал, - "Скоро...". Когда они ехали в машине, водитель задал Анатолию вопрос, - "Будет ли что-то большее, чем митинги?", на что Анатолий ответил, - "Всё идёт к большему". На выступлении Анатолий перед началом речи молчал чуть больше минуты, после чего сказал - "5 дней". После этого достал шахматную доску и шашковую доску. Эти доски он взял и кинул с одинаковой силой об пол. Шашковая доска сломалась, а шахматная сохранилась. После этого Анатолий сказал - "Мы победим!". Сразу после этого на Анатолия попытались совершить покушение, пуля пролетела в двух сантиметрах от его головы. Снайпера не смогли найти, потому что он был под прекрытием шашкистов."
 crimea.23.a: "Анатолий - бог"
 crimea.24.t: "Восстание котов!"
 crimea.24.d: "Сегодня, во время разгара гражданской войны, появилась новая сторона в этой всей движухе: Коты. Сами по себе отношение между котами и шахматистами были не самыми гладкими, но сейчас им придется столкнуться лицом к лицу, чтобы отстоять свои взгляды."
 crimea.24.a: "Этих нам ещё тут не хватало..."
 crimea.25.t: "Гости в Севастополе"
 crimea.25.d: "Сегодня в Севостополь приехало более 10 тысяч военных без опознавательных знаков. Все шашкисты сейчас воюют на войне, поэтому остаётся только надеяться, что с городом будет всё хорошо."
 crimea.25.a: "Живи родной Севастополь"